openapi: 3.0.3
info:
  title: DropMtaani API — endpoints used by the agent
  version: 2026-10-27
  description: >
    Subset of the DropMtaani customer API that the public agent calls.
    Paths and parameters only; no server internals.
servers:
  - url: https://CHANGE-ME
    description: Set per environment via DROPMTAANI_API_BASE (never commit real hosts).

security:
  - bearerAuth: []

paths:
  /api/v1/module:
    get:
      summary: Active modules for a zone (agent keeps food/grocery/pharmacy/ecommerce)
      parameters:
        - name: zone_id
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Module list }

  /api/v1/items/search:
    get:
      summary: Search products by name
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ZoneId'
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product list (paginated) }

  /api/v1/items/details/{id}:
    get:
      summary: Single product with price, store and variations
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Product details }

  /api/v1/items/popular:
    get:
      summary: Popular products
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200': { description: Product list }

  /api/v1/items/discounted:
    get:
      summary: Discounted products (deals)
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200': { description: Product list }

  /api/v1/stores/search:
    get:
      summary: Search stores by name
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ZoneId'
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Store list }

  /api/v1/categories/:
    get:
      summary: Category list
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Category list }

  /api/v1/categories/items/{category_id}:
    get:
      summary: Items in one category (category-first search resolution)
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: category_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Category items }

  /api/v1/customer/cart/list:
    get:
      summary: Cart contents for one store
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: store_id
          in: query
          required: true
          schema: { type: integer }
        - name: guest_id
          in: query
          schema: { type: string }
      responses:
        '200': { description: Cart rows with totals }

  /api/v1/customer/cart/add:
    post:
      summary: Add an item to the cart
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, model, price, quantity, store_id]
              properties:
                item_id: { type: integer }
                model: { type: string, enum: [Item, ItemCampaign] }
                price: { type: number }
                quantity: { type: integer, minimum: 1 }
                store_id: { type: integer }
                guest_id: { type: string }
                variation: { type: array, items: {} }
      responses:
        '200': { description: Updated cart }

  /api/v1/customer/cart/update:
    post:
      summary: Change a cart row quantity
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_id, price, quantity, store_id]
              properties:
                cart_id: { type: integer }
                price: { type: number }
                quantity: { type: integer, minimum: 1 }
                store_id: { type: integer }
                guest_id: { type: string }
      responses:
        '200': { description: Updated cart }

  /api/v1/customer/address/list:
    get:
      summary: Saved delivery addresses
      responses:
        '200': { description: Address list }

  /api/v1/stores/details/{id}:
    get:
      summary: One store (coordinates for delivery distance)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Store }

  /api/v1/customer/order/place:
    post:
      summary: Place one store bucket as an order
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, order_type, payment_method]
              properties:
                store_id: { type: integer }
                order_type: { type: string, enum: [delivery, take_away] }
                payment_method: { type: string, enum: [cash_on_delivery, digital_payment, wallet] }
                address: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                distance: { type: number }
                coupon_code: { type: string }
                guest_id: { type: string }
      responses:
        '200': { description: Order receipt with order_id }

  /api/v1/customer/order/list:
    get:
      summary: Recent orders
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Order list }

  /api/v1/customer/order/track:
    get:
      summary: One order's tracking detail
      parameters:
        - name: order_id
          in: query
          required: true
          schema: { type: integer }
        - name: contact_number
          in: query
          schema: { type: string }
      responses:
        '200': { description: Order with status }

  /api/v1/auth/demo-magic:
    post:
      summary: Trade a judge magic-link token for a demo customer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Login-shaped session (token, is_demo=1, login_type=demo)
        '403': { description: Invalid, expired or revoked link (never 422) }

  /api/v1/customer/cart/remove-item:
    delete:
      summary: Remove one cart row
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_id, store_id]
              properties:
                cart_id: { type: integer }
                store_id: { type: integer }
                guest_id: { type: string }
      responses:
        '200': { description: Updated cart }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Customer token, else the scoped agent service token.
  parameters:
    ModuleId:
      name: moduleId
      in: header
      schema: { type: integer }
      description: Active shopping module id.
    ZoneId:
      name: zoneId
      in: header
      schema: { type: string }
      description: JSON array of zone ids covering the delivery point.
